<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Média de 4 valores</title>
</head>
<body>
    <nav>
        <ul>
            <li><a href="ex001.html">Exercício 1</a></li>
            <li><a href="ex002.html">Exercício 2</a></li>
            <li><a href="ex003.html">Exercício 3</a></li>
            <li><a href="ex004.html">Exercício 4</a></li>
            <li><a href="ex005.html">Exercício 5</a></li>
            <li><a href="ex006.html">Exercício 6</a></li>
            <li><a href="ex007.html">Exercício 7</a></li>
            <li><a href="ex008.html">Exercício 8</a></li>
        </ul>
    </nav>
    <form>
        <h1>Calcular a Média de 4 Valores</h1>
        <label for="valor1">Digite o primeiro valor</label>
        <input type="number" id="valor1">
        <label for="valor2">Digite o segundo valor</label>
        <input type="number" id="valor2">
        <label for="valor3">Digite o terceiro valor</label>
        <input type="number" id="valor3">
        <label for="valor4">Digite o quarto valor</label>
        <input type="number" id="valor4">
        <button>Calcular</button>
        <div id="resultado"></div>
    </form>
    <script>
        const form = document.querySelector('form');
        form.addEventListener('submit', function(event) {
            event.preventDefault();
            const valor1 = document.getElementById('valor1').value;
            const valor2 = document.getElementById('valor2').value;
            const valor3 = document.getElementById('valor3').value;
            const valor4 = document.getElementById('valor4').value;
            const media = (parseFloat(valor1) + parseFloat(valor2) + parseFloat(valor3) + parseFloat(valor4)) / 4;
            document.getElementById('resultado').innerText = `A média dos valores é: ${media}`;
        });
    </script>
</body>
</html>
